version: "3.9"

services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    image: lab-file-share-backend:dev
    environment:
      - DATABASE_URL=postgresql://lab:lab@db:5432/labfiles
      - STORAGE_MODE=local
      - STORAGE_LOCAL_PATH=/data/storage
    volumes:
      - ./storage:/data/storage
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=labfiles
      - POSTGRES_USER=lab
      - POSTGRES_PASSWORD=lab
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

volumes:
  dbdata:
