openapi: 3.0.3
info:
  title: Lab File Share API
  version: 0.1.0
servers:
  - url: /api
paths:
  /auth/login:
    post:
      summary: Login and issue token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer }
                  user:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      role: { type: string }
  /files:
    get:
      summary: List files
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: doc_type
          schema: { type: string }
        - in: query
          name: project_code
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1, minimum: 1 }
        - in: query
          name: page_size
          schema: { type: integer, default: 20, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: File list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/File" }
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
  /files/upload:
    post:
      summary: Upload file (multipart or chunk protocol)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
  /files/{id}:
    get:
      summary: Get file detail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
  /files/{id}/download:
    get:
      summary: Download file (stream)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Binary stream
  /files/batch-download:
    post:
      summary: Batch download as zip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_ids]
              properties:
                file_ids:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Zip stream
  /files/{id}/lock:
    post:
      summary: Lock file for editing (checkout)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Locked
  /files/{id}/unlock:
    post:
      summary: Unlock file (check-in)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Unlocked
  /admin/audit-logs:
    get:
      summary: Get audit logs (admin)
      responses:
        "200":
          description: Logs
components:
  schemas:
    File:
      type: object
      properties:
        id: { type: string }
        original_name: { type: string }
        stored_path: { type: string }
        file_size: { type: integer }
        mime_type: { type: string }
        checksum_sha256: { type: string }
        version: { type: integer }
        parent_file_id: { type: string, nullable: true }
        is_latest: { type: boolean }
        lock_status: { type: string, enum: [UNLOCKED, LOCKED] }
        locked_by: { type: string, nullable: true }
        uploader_id: { type: string }
        created_at: { type: string, format: date-time }
        expiry_date: { type: string, format: date, nullable: true }
        is_active: { type: boolean }
